# Qdrant Cloud suspends free-tier clusters after about a week without traffic,
# which breaks every chat with a 502. One small read every few days keeps it awake.
# Needs repo secrets QDRANT_URL and QDRANT_API_KEY (same values as the backend).
name: Qdrant keep-alive

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: List collections
        env:
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        run: |
          if [ -z "$QDRANT_URL" ] || [ -z "$QDRANT_API_KEY" ]; then
            echo "::error::Set the QDRANT_URL and QDRANT_API_KEY repository secrets"
            exit 1
          fi
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 \
            -H "api-key: $QDRANT_API_KEY" "${QDRANT_URL%/}/collections")
          echo "Qdrant responded with HTTP $status"
          [ "$status" = "200" ]
